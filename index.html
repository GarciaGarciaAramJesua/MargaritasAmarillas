<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Un ramo de margaritas amarillas con un mensaje especial para ti." />
  <title>Ramo de Margaritas 🌼</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌼</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="petals-canvas"></canvas>

  <main class="stage">
    <section class="card">
      <div class="bouquet-wrap" id="bouquet-wrap">
        <!-- Ramo de margaritas en SVG -->
        <svg id="bouquet" viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramo de margaritas amarillas">
          <defs>
            <radialGradient id="centerGrad" cx="35%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#8a5a2b"/>
              <stop offset="100%" stop-color="#5e3a1a"/>
            </radialGradient>
            <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6fae4f"/>
              <stop offset="100%" stop-color="#4c8a35"/>
            </linearGradient>
            <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e7cfa1"/>
              <stop offset="100%" stop-color="#c9a877"/>
            </linearGradient>
            <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7a5b2a" flood-opacity="0.25"/>
            </filter>
          </defs>

          <!-- Cono de papel -->
          <g filter="url(#softShadow)">
            <path d="M150 300 L270 300 L245 460 Q210 480 175 460 Z" fill="url(#coneGrad)" stroke="#b0895a" stroke-width="2"/>
            <path d="M150 300 L210 460 L270 300" fill="none" stroke="#b0895a" stroke-width="1.5" opacity="0.6"/>
          </g>

          <!-- Hojas -->
          <g class="sway sway-1">
            <path d="M170 300 C120 280 90 230 100 180 C150 200 175 250 180 300 Z" fill="url(#leafGrad)"/>
          </g>
          <g class="sway sway-2">
            <path d="M250 300 C300 280 330 230 320 180 C270 200 245 250 240 300 Z" fill="url(#leafGrad)"/>
          </g>
          <g class="sway sway-3">
            <path d="M210 300 C205 250 210 200 230 150 C255 195 250 250 235 300 Z" fill="url(#leafGrad)"/>
          </g>

          <!-- Tallos -->
          <g stroke="#4c8a35" stroke-width="6" stroke-linecap="round">
            <path d="M180 300 Q170 220 150 160" fill="none"/>
            <path d="M210 300 Q210 210 210 130" fill="none"/>
            <path d="M240 300 Q250 220 270 160" fill="none"/>
          </g>

          <!-- Margaritas (grupo reutilizable) -->
          <g id="daisy-template">
            <g class="petals">
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(30)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(60)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(90)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(120)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(150)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(180)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(210)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(240)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(270)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(300)"/>
              <ellipse cx="0" cy="-38" rx="11" ry="26" fill="#ffd23f" transform="rotate(330)"/>
            </g>
            <circle r="20" fill="url(#centerGrad)"/>
            <circle r="20" fill="none" stroke="#4a2e12" stroke-width="1" opacity="0.3"/>
          </g>

          <g class="background-bouquet" aria-hidden="true">
            <use href="#daisy-template" x="105" y="175" class="background-flower" style="--d:.15s"/>
            <use href="#daisy-template" x="125" y="125" class="background-flower" style="--d:.3s"/>
            <use href="#daisy-template" x="92" y="225" class="background-flower" style="--d:.45s"/>
            <use href="#daisy-template" x="145" y="235" class="background-flower" style="--d:.6s"/>
            <use href="#daisy-template" x="115" y="270" class="background-flower" style="--d:.75s"/>
            <use href="#daisy-template" x="315" y="175" class="background-flower" style="--d:.25s"/>
            <use href="#daisy-template" x="295" y="125" class="background-flower" style="--d:.4s"/>
            <use href="#daisy-template" x="328" y="225" class="background-flower" style="--d:.55s"/>
            <use href="#daisy-template" x="275" y="235" class="background-flower" style="--d:.7s"/>
            <use href="#daisy-template" x="305" y="270" class="background-flower" style="--d:.85s"/>
          </g>

          <use href="#daisy-template" x="150" y="160" class="flower bloom" style="--d:.1s"/>
          <use href="#daisy-template" x="210" y="130" class="flower bloom" style="--d:.3s"/>
          <use href="#daisy-template" x="270" y="160" class="flower bloom" style="--d:.5s"/>
          <use href="#daisy-template" x="182" y="190" class="flower bloom small" style="--d:.7s"/>
          <use href="#daisy-template" x="238" y="190" class="flower bloom small" style="--d:.9s"/>

          <!-- Detalles pequeños (flores amarillas de relleno) -->
          <g fill="#ffe27a" opacity="0.9">
            <circle cx="165" cy="240" r="4"/>
            <circle cx="255" cy="250" r="4"/>
            <circle cx="200" cy="270" r="3.5"/>
          </g>
        </svg>
      </div>

      <div class="message-area">
        <h1 class="title">Para ti 🌼</h1>
        <p id="message-text" class="message">Perdoname por no darte tus flores amarillas en físico, pero esto es una promesa de que en cuanto tenga la posibilidad te las daré jeje<br><br>Te amooooo!!<br><br>-Tu menso fav</p>
        <button id="chime-toggle" class="chime-btn" type="button" aria-pressed="false">🔕 Activar sonido</button>
      </div>
    </section>

    <footer class="footer">
      Hecho con 🌼 y mucho cariño
    </footer>
  </main>

  <script src="js/main.js"></script>
  <script src="js/chimes.js"></script>
</body>
</html>
